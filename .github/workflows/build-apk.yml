name: Build Sadhya APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Check that all files and folders were uploaded
        run: |
          missing=0
          for f in package.json capacitor.config.json index.html manifest.webmanifest sw.js \
                   icons/icon-512.png android-res/splash.png android-res/mipmap-hdpi/ic_launcher.png \
                   android-res/mipmap-anydpi-v26/ic_launcher.xml android-signing/sadhya.keystore; do
            if [ -e "$f" ]; then echo "OK       $f"; else echo "MISSING  $f"; missing=1; fi
          done
          if [ $missing = 1 ]; then
            echo "::error::Some files are missing (see MISSING above). Drag the icons, android-res and android-signing FOLDERS into GitHub's upload page, then commit."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Use the Android SDK already on GitHub's machine
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          echo "sdkmanager: $SDKM"
          if [ -n "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null || true; fi


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate plan from Excel
        run: |
          python -m pip install openpyxl
          python tools/extract_plan.py

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Copy the web app into www/
        run: npm run web

      - name: Create the Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Put in the Sadhya icon and splash screen
        run: |
          RES=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p $RES/mipmap-$d
            cp android-res/mipmap-$d/*.png $RES/mipmap-$d/
          done
          mkdir -p $RES/mipmap-anydpi-v26
          cp android-res/mipmap-anydpi-v26/*.xml $RES/mipmap-anydpi-v26/
          find $RES -name 'splash.png' -exec cp android-res/splash.png {} \;

      - name: Set the version number (so each build installs as an update)
        run: |
          sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Copy web app into Android
        run: npx cap sync android

      - name: Use the same signing key every build
        run: |
          mkdir -p ~/.android
          cp android-signing/sadhya.keystore ~/.android/debug.keystore

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name it Sadhya.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Sadhya.apk

      - name: Save the APK (Actions run page, bottom)
        uses: actions/upload-artifact@v4
        with:
          name: Sadhya-apk
          path: Sadhya.apk

      - name: Publish it under Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Sadhya v1.${{ github.run_number }}
          body: Download Sadhya.apk below and open it on your phone to install or update.
          files: Sadhya.apk
